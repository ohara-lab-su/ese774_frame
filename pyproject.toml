[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ese774-frame"

version = "0.6.4"

description = "REST communication framework for transparent access to Python device classes via FastAPI servers and synchronous/asynchronous clients."
authors = [
    { name = "Kengo NAKADA", email = "kengo.nakada@email.com" }
]
readme = "README.md"
#requires-python = ">=3.10"  # 必要に応じて更新
requires-python = ">=3.7"  # 必要に応じて更新
dependencies = [
    "xlogger-py",
    #
    "fastapi",
    "uvicorn",
    "pydantic",
    "sphinx",
    #
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "linkify-it-py"
]

[project.urls]
Homepage = "https://ohara-lab-su.github.io/ese774_frame/"
Documentation = "https://ohara-lab-su.github.io/ese774_frame/"
Repository = "https://github.com/ohara-lab-su/ese774_frame"
Issues = "https://github.com/ohara-lab-su/ese774_frame/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ese774*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
